name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-and-readme:
    name: Version train + README discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Release-train guard: package.json.version === CHANGELOG === README badges.
      - name: Version coherence
        run: node tools/version-check.mjs